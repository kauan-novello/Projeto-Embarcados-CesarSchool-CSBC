services:
  backend:
    volumes:
      - ./applications/backend:/backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  ml:
    volumes:
      - ./src:/ml/src
      - ./notebooks:/ml/notebooks
      - ./mlruns:/ml/mlruns
    ports:
      - "127.0.0.1:8888:8888"
    command: ["jupyter", "lab", "--ip=0.0.0.0", "--port=8888", "--no-browser", "--allow-root", "--NotebookApp.token="]
