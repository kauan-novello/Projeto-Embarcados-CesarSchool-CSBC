[project]
name = "weather-station"
version = "0.1.0"
description = "Virtual ESP: publishes the plant's current Open-Meteo weather over the SolarSense MQTT contract"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "paho-mqtt>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
weather-station = "weather_station.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
